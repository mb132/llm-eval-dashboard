services:
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/storage/llm_eval.db}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      LLM_EVAL_MASTER_KEY: ${LLM_EVAL_MASTER_KEY:?set LLM_EVAL_MASTER_KEY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/storage

volumes:
  app-data:
