[project]
name = "llm-eval-dashboard"
version = "0.1.0"
description = "Minimal full-stack foundation for the LLM Evaluation Platform"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.8",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ty.environment]
python-version = "3.13"
root = ["backend"]
